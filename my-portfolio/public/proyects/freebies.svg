<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" role="img" aria-label="Freebies app icon">
  <defs>
    <linearGradient id="tileGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#5B21B6"/>
    </linearGradient>
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#F5C744"/>
    </linearGradient>
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#3B0764" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- app icon tile -->
  <g filter="url(#softShadow)">
    <rect x="460" y="170" width="360" height="360" rx="76" fill="url(#tileGrad)"/>
    <rect x="460" y="170" width="360" height="360" rx="76" fill="none" stroke="#C4B5FD" stroke-opacity="0.35" stroke-width="2"/>
  </g>

  <!-- gift box -->
  <g>
    <rect x="573" y="428" width="134" height="108" rx="10" fill="#FFFFFF" fill-opacity="0.96"/>
    <rect x="556" y="388" width="168" height="42" rx="10" fill="#FFFFFF"/>
    <rect x="631" y="388" width="18" height="148" fill="url(#ribbonGrad)"/>
    <rect x="573" y="474" width="134" height="16" fill="url(#ribbonGrad)"/>
    <!-- bow -->
    <path d="M640 388 C 610 388 592 362 604 340 C 616 320 638 330 640 356 Z" fill="url(#ribbonGrad)"/>
    <path d="M640 388 C 670 388 688 362 676 340 C 664 320 642 330 640 356 Z" fill="url(#ribbonGrad)"/>
    <circle cx="640" cy="382" r="10" fill="#F5C744"/>
  </g>

  <!-- offer badge -->
  <g>
    <circle cx="783" cy="255" r="48" fill="#FFFFFF"/>
    <circle cx="783" cy="255" r="48" fill="none" stroke="#5B21B6" stroke-width="3"/>
    <text x="783" y="248" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="21" fill="#5B21B6">1+1</text>
    <text x="783" y="270" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="600" font-size="13" fill="#7C3AED">FREE</text>
  </g>

  <!-- wordmark -->
  <text x="640" y="660" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="68" fill="#FFFFFF">Freebies</text>
  <text x="640" y="698" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="500" font-size="24" fill="#C4B5FD">Shopify Promotions Engine</text>
</svg>
